<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Digital Closet</title>

  <!-- ── Open Graph (Facebook, iMessage, WhatsApp, etc.) ──────────────────── -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://mydigitalcloset.replit.app/share/" />
  <meta property="og:title"       content="My Digital Closet" />
  <meta property="og:description" content="Organize your wardrobe, discover styles, and share your looks. Download free on the App Store." />
  <meta property="og:image"       content="https://mydigitalcloset.replit.app/icon-1024.png" />
  <meta property="og:image:width"  content="1024" />
  <meta property="og:image:height" content="1024" />

  <!-- ── Twitter / X ──────────────────────────────────────────────────────── -->
  <meta name="twitter:card"        content="summary" />
  <meta name="twitter:title"       content="My Digital Closet" />
  <meta name="twitter:description" content="Organize your wardrobe, discover styles, and share your looks." />
  <meta name="twitter:image"       content="https://mydigitalcloset.replit.app/icon-1024.png" />

  <!-- ── Apple Smart App Banner ───────────────────────────────────────────── -->
  <meta name="apple-itunes-app" content="app-id=6789233372" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(240,192,48,0.35);
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 36px;
    }

    .app-store-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #F0C030;
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 14px;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .app-store-btn:active {
      transform: translate(2px,2px);
      box-shadow: 2px 2px 0 #000;
    }

    .apple-logo {
      width: 22px;
      height: 22px;
      fill: #000;
    }

    .redirect-note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <img class="icon" src="/icon-1024.png" alt="My Digital Closet icon" />

  <h1>My Digital Closet</h1>
  <p>Organize your wardrobe, discover styles, and share your looks with the community.</p>

  <a class="app-store-btn" href="https://apps.apple.com/us/app/my-digital-closet/id6789233372">
    <svg class="apple-logo" viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg">
      <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 376.7 0 245.8 0 121.7c0-123.4 79-196.2 155.5-196.2 79 0 127.5 52.1 170.8 52.1 43.3 0 97.9-54.2 185.7-54.2z"/>
    </svg>
    Download on the App Store
  </a>

  <p class="redirect-note" id="redirect-note"></p>

  <script>
    const APP_STORE = 'https://apps.apple.com/us/app/my-digital-closet/id6789233372';
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase());

    if (isIOS) {
      document.getElementById('redirect-note').textContent = 'Redirecting to the App Store…';
      setTimeout(function() {
        window.location.href = APP_STORE;
      }, 800);
    }
  </script>

</body>
</html>
