workflows:
  ios-release:
    name: My Digital Shoes — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      groups:
        - ios_workflow
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalshoes.app
      vars:
        XCODE_PROJECT: "artifacts/outfit-generator/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.mydigitalshoes.app"
        APPLE_TEAM_ID: "QXGDJ93HP8"
      node: 22.13.0

    scripts:
      - name: Install pnpm
        script: |
          set -e
          corepack disable || true
          npm uninstall -g pnpm || true
          npm install -g pnpm@10.28.2
          pnpm --version

      - name: Install dependencies
        script: |
          set -e
          rm -rf node_modules
          rm -rf artifacts/outfit-generator/node_modules
          pnpm install --frozen-lockfile --force

      - name: Build web app
        script: |
          set -e
          # Guard: fail the build immediately if the RC key is missing so we
          # never ship a bundle that silently has purchases disabled.
          if [ -z "$VITE_REVENUECAT_IOS_API_KEY" ]; then
            echo "❌ VITE_REVENUECAT_IOS_API_KEY is empty — add it to the ios_workflow environment group in Codemagic and rebuild."
            exit 1
          fi
          echo "✅ RC iOS key present (prefix: ${VITE_REVENUECAT_IOS_API_KEY:0:8}...)"
          # Pass VITE_ secrets inline so Vite bakes them into the bundle
          # without relying on .env file paths.
          VITE_REVENUECAT_IOS_API_KEY="$VITE_REVENUECAT_IOS_API_KEY" \
          VITE_REVENUECAT_TEST_API_KEY="$VITE_REVENUECAT_TEST_API_KEY" \
          pnpm --filter @workspace/outfit-generator build

      - name: Sync Capacitor iOS
        script: |
          cd artifacts/outfit-generator
          npx cap sync ios

      - name: Stamp display name
        script: |
          PLIST="$CM_BUILD_DIR/artifacts/outfit-generator/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'My Shoes'" "$PLIST"

      - name: Set build number
        script: |
          cd artifacts/outfit-generator/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build and sign iOS
        script: |
          set -e
          EXPORT_PLIST="$HOME/export_options.plist"
          rm -f "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" "$EXPORT_PLIST"
          plutil -lint "$EXPORT_PLIST"
          cat "$EXPORT_PLIST"
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/artifacts/outfit-generator/ios/App/App.xcodeproj" \
            --scheme "App" \
            --export-options-plist "$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
